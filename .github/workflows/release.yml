name: Release

on:
  push:
    tags:
      - "v*"
  # Invoked on a tag ref by tag-release.yml (a tag pushed with GITHUB_TOKEN
  # does not fire the push trigger above). The version-check step below still
  # guards this path: dispatched on a non-tag ref, GITHUB_REF_NAME is a
  # branch name and never matches the package version.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false # queue releases; never cancel a publish mid-flight

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      # Building the device server APK that ships in the package needs a
      # JDK 17; the runner image already carries the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly re-runs typecheck + test, then builds the device server
      # APK and the CLI, before the tarball is created
      - run: npm publish
